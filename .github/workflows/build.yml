# Builds an installable addon package on every push so it can be downloaded
# from the Actions tab without a WoW client on this machine.
#
# The BigWigs packager pulls Ace3 from .pkgmeta, so the artifact contains a
# complete Sprout/ folder. Download it, unzip, and drop Sprout/ into
# Interface/AddOns. No secrets are needed: nothing is uploaded anywhere.
name: Build

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package
        uses: BigWigsMods/packager@v2
        with:
          # -d skip uploading, -z skip the inner zip so the artifact is a
          # single zip with Sprout/ at its root.
          args: -d -z

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Sprout
          path: .release/
          if-no-files-found: error
          retention-days: 30
