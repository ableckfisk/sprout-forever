# Builds an installable package for every pull request so the change can be
# tested in game before it is merged. Download it from the run's Artifacts.
#
# The BigWigs packager pulls the libraries from .pkgmeta, so the artifact
# contains a complete Sprout/ folder. No secrets are needed.
name: Build

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Package
        uses: BigWigsMods/packager@v2
        with:
          # -d skip uploading, -z skip the inner zip so the artifact is a
          # single zip with Sprout/ at its root.
          args: -d -z

      - name: Upload package
        uses: actions/upload-artifact@v5
        with:
          name: Sprout
          path: .release/
          # The packager writes to a dot-folder, which upload-artifact skips
          # unless told otherwise.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
