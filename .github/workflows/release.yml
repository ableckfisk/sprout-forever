# Packages a tagged commit with the BigWigs packager and publishes it as a
# GitHub Release. Runs when a v* tag is pushed by hand, or when the Tag
# workflow dispatches it after a merge to main.
#
# CurseForge and Wago uploads switch on automatically once these repository
# secrets exist and the matching X-Curse-Project-ID / X-Wago-ID fields are
# filled in Sprout.toc:
#   CF_API_KEY       CurseForge API token
#   WAGO_API_TOKEN   Wago Addons API token
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Package and release
        uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
